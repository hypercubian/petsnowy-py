name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

# Read-only deploy key for this project's private git dependency (qaplat).
# One key per dependency: a GitHub deploy key can only ever be attached to a
# single repository.
env:
  DEPLOY_KEY_HYPERCUBIAN_QA_PLATINUM_STANDARDS: ${{ secrets.DEPLOY_KEY_HYPERCUBIAN_QA_PLATINUM_STANDARDS }}

jobs:
  lint:
    name: lint (mypy / pylint / bandit / pre-commit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: '2.3.2'
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Authorise private dependencies
        run: bash .github/scripts/auth-private-deps.sh hypercubian-qa-platinum-standards

      - name: Cache virtualenv
        id: cache-venv
        uses: actions/cache@v4
        with:
          path: .venv
          key: lint-venv-v2-${{ runner.os }}-py3.12-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        run: poetry install --with dev --no-interaction

      - name: mypy --strict
        run: poetry run mypy src

      - name: pylint --errors-only
        run: poetry run pylint --errors-only src/petsnowy

      - name: bandit
        run: poetry run bandit -r src/petsnowy -c pyproject.toml

      - name: pre-commit (all hooks)
        run: poetry run pre-commit run --all-files --show-diff-on-failure

  test:
    name: test (${{ matrix.os }} / py${{ matrix.python-version }})
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # 3.14 beyond the standard's three-version window: Home Assistant (the main
        # consumer, via ha-petsnowy) runs on 3.14.
        python-version: ['3.11', '3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: '2.3.2'
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Authorise private dependencies
        run: bash .github/scripts/auth-private-deps.sh hypercubian-qa-platinum-standards

      - name: Cache virtualenv
        id: cache-venv
        uses: actions/cache@v4
        with:
          path: .venv
          key: >-
            test-venv-${{ runner.os }}-py${{ matrix.python-version }}-${{
            hashFiles('poetry.lock') }}

      - name: Install dependencies
        run: poetry install --with dev --no-interaction

      - name: pytest (unit + integration + functional)
        run: poetry run pytest -q --cov=src/petsnowy --cov-report=term

  build:
    name: build sdist + wheel
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: '2.3.2'

      - name: Build artifacts
        run: poetry build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          if-no-files-found: error
          retention-days: 30
